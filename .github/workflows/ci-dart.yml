name: Dart/Flutter CI

on:
  push:
    branches: [mobile-sdk]
    paths:
      - "bindings/dart/**"
      - ".github/workflows/ci-dart.yml"
  pull_request:
    paths:
      - "bindings/dart/**"
      - ".github/workflows/ci-dart.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-rust:
    name: Check Rust (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('bindings/dart/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-
      - name: Check native
        run: cargo check --manifest-path bindings/dart/Cargo.toml

  check-android:
    name: Check Rust (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install-action@v3
        with:
          crate: cargo-ndk
      - name: Check Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a check --manifest-path bindings/dart/Cargo.toml

  check-ios:
    name: Check Rust (iOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check iOS ARM64
        run: cargo check --manifest-path bindings/dart/Cargo.toml --target aarch64-apple-ios

  build-android:
    name: Build Android .so
    runs-on: ubuntu-latest
    needs: check-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Install cargo-ndk
        uses: baptiste0928/cargo-install-action@v3
        with:
          crate: cargo-ndk
      - name: Build Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o bindings/dart/keri/keri_android/android/src/main/jniLibs \
            build --release --manifest-path bindings/dart/Cargo.toml
      - name: Upload Android libs
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: bindings/dart/keri/keri_android/android/src/main/jniLibs/

  build-ios:
    name: Build iOS static lib
    runs-on: macos-latest
    needs: check-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim
      - name: Install cargo-lipo
        uses: baptiste0928/cargo-install-action@v3
        with:
          crate: cargo-lipo
      - name: Build iOS universal
        run: cargo lipo --release --manifest-path bindings/dart/Cargo.toml
      - name: Upload iOS libs
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs
          path: target/universal/release/libdartkeriox.a

  test-rust:
    name: Test Rust FFI
    runs-on: ubuntu-latest
    needs: check-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('bindings/dart/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run tests
        run: cargo test --manifest-path bindings/dart/Cargo.toml
