[package]
name = "dkms-node"
version = "0.1.0"
edition = "2021"
exclude = ["index.node"]

[profile.release]
strip = true
opt-level = "z"
lto = true

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror = "1.0"
napi = { version = "2.16", features = ["serde-json", "async"] }
napi-derive = "2.16"
serde_json = "1"
keri-sdk = { path = "../../../keriox/keriox_sdk" }

# keri-sdk pulls cesrox from a local checkout (it carries unreleased beta
# changes the SDK depends on); mirror keriox's own patch so this binding
# resolves the same source.
[patch.crates-io]
cesrox = { path = "../../../cesrox/cesr" }
