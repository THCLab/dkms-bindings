[package]
name = "dkms-go"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
opt-level = "z"
lto = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# cesrox must match keri-sdk's cesrox (keriox `development` pins 2.0.0-beta.x):
# the Basic / SelfSigning derivation codes in utils/ are handed to keri-sdk's
# BasicPrefix::new / SelfSigningPrefix::new and must unify to one version.
cesrox = "2.0.0-beta.7"
thiserror = "1.0"
base64 = "0.13.0"
simple_config_parser = "0.1.5"
clap = "3.0.0-beta.4"
tempfile = "3.1"
serde_json = "1.0.81"
# This direct `said` is used ONLY by acdc_build, which works with the `acdc`
# crate's said (it pins 0.4.x). All KERI SAID types come from keri-sdk's own
# said (0.5.x) via keri_sdk::advanced re-exports, so the two said versions
# coexist without their types ever crossing paths.
said = "0.4.3"
acdc = { git = "https://github.com/THCLab/acdc-rust" }
# Single mid-level dependency replacing keri-core, keri-controller and teliox.
# Everything we need is re-exported under `keri_sdk::advanced::*`.
keri-sdk = { git = "https://github.com/THCLab/keriox", branch = "development", features = ["storage-postgres"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[target.'cfg(all(any(windows, unix), target_arch = "x86_64", not(target_env = "musl")))'.dependencies]
mimalloc = {version = "0.1"}

uuid = { version = "=1.3.3", features = ["v4", "fast-rng"] }
