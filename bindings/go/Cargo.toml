[package]
name = "dkms-go"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
opt-level = "z"
lto = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
cesrox = "0.1.8"
thiserror = "1.0"
base64 = "0.13.0"
simple_config_parser = "0.1.5"
clap = "3.0.0-beta.4"
tempfile = "3.1"
serde_json = "1.0.81"
said = "0.4.1"
acdc = { git = "https://github.com/THCLab/acdc-rust" }
keri-core = { git = "https://github.com/THCLab/keriox", branch = "feat_db_abstraction", features = ["oobi", "mailbox"] }
keri-controller = { git = "https://github.com/THCLab/keriox", branch = "feat_db_abstraction", features = ["storage-postgres"] }
teliox = { git = "https://github.com/THCLab/keriox", branch = "feat_db_abstraction" }
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }

[target.'cfg(all(any(windows, unix), target_arch = "x86_64", not(target_env = "musl")))'.dependencies]
mimalloc = {version = "0.1"}

uuid = { version = "=1.3.3", features = ["v4", "fast-rng"] }
