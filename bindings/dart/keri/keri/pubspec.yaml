name: keri
description: Dart client for managing KERI based Identifiers on various platforms.
version: 3.0.0
homepage: https://github.com/THCLab/keri-bindings/tree/master/bindings/dart/keri/keri

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  keri_platform_interface:
    path: ../keri_platform_interface
  keri_android:
    path: ../keri_android
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: keri_android
