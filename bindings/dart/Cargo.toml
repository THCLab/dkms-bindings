[package]
name = "keri-dart"
version = "0.2.0"
edition = "2021"
description = "Flutter/Dart FFI bindings for keriox-sdk via flutter_rust_bridge v2"

[lib]
name = "dartkeriox"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
keri-sdk = { path = "../../../keriox/keriox_sdk", features = ["keyprovider"] }
keri-keyprovider = { path = "../../../keriox/keri_keyprovider", features = ["host", "software"] }
keri-core = { path = "../../../keriox/keriox_core" }
keri-controller = { path = "../../../keriox/components/controller" }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
url = "2"
said = "0.5.3-beta"
cesrox = "2.0.0-beta"

[dev-dependencies]
tempfile = "3"

# keri-core currently requires cesrox 2.0.0-beta.7 (added with the upcoming
# secp256r1 support), which hasn't been published yet — pin to the sibling
# checkout so cargo can resolve.
[patch.crates-io]
cesrox = { path = "../../../cesrox/cesr" }
said = { path = "../../../cesrox/said" }
